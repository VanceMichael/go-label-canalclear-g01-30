services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canalclear
      POSTGRES_PASSWORD: canalclear
      POSTGRES_DB: canalclear
    ports:
      - "55441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canalclear -d canalclear"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - canalclear_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgres://canalclear:canalclear@postgres:5432/canalclear?sslmode=disable
      CANALCLEAR_ADDR: :8080
    ports:
      - "58040:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  canalclear_pg:
